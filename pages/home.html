<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Banco Gitano</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0c0c0e;
      color: #f0f0f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #1e1e22;
      flex-shrink: 0;
    }
    .topbar-brand {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-user {
      font-size: 0.8125rem;
      color: #555;
    }
    .btn-logout {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      background: none;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      color: #888;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-logout:active { color: #ef5350; border-color: #ef5350; }

    /* ── Scrollable main ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Summary row ── */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .s-card {
      background: #161618;
      border: 1px solid #1e1e22;
      border-radius: 10px;
      padding: 14px 12px;
    }
    .s-card .label {
      font-size: 0.6875rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .s-card .value {
      font-size: 1rem;
      font-weight: 700;
    }
    .s-card.income  .value { color: #4caf50; }
    .s-card.expense .value { color: #ef5350; }
    .s-card.balance .value { color: #fff; }

    /* ── Refresh button ── */
    .btn-refresh {
      width: 100%;
      padding: 16px;
      background: #1565c0;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .btn-refresh:active { background: #0d47a1; }
    .btn-refresh svg { flex-shrink: 0; }
    .btn-refresh.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #888;
      font-size: 0.8125rem;
    }
    .month-filter {
      flex: 1;
      padding: 10px 12px;
      background: #161618;
      border: 1px solid #2a2a2e;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 0.8125rem;
      outline: none;
    }

    /* ── View card ── */
    .view-card {
      background: #161618;
      border: 1px solid #1e1e22;
      border-radius: 10px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .view-card h2 {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .chart-wrap {
      position: relative;
      min-height: 260px;
    }

    /* ── Table ── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }
    .data-table thead th {
      padding: 8px 10px;
      text-align: left;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      border-bottom: 1px solid #1e1e22;
    }
    .data-table tbody tr { border-bottom: 1px solid #1a1a1d; }
    .data-table td { padding: 10px; color: #ccc; }
    .data-table td.desc { color: #f0f0f0; font-weight: 500; }
    .data-table td.inc  { color: #4caf50; font-weight: 600; }
    .data-table td.exp  { color: #ef5350; font-weight: 600; }

    /* ── Bottom nav ── */
    .bottom-nav {
      display: flex;
      border-top: 1px solid #1e1e22;
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 8px;
      background: none;
      border: none;
      color: #444;
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: color 0.15s;
    }
    .nav-btn svg { width: 20px; height: 20px; }
    .nav-btn.active { color: #1976d2; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #1e1e22;
      border: 1px solid #2a2a2e;
      color: #f0f0f0;
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 0.8125rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      z-index: 99;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <span class="topbar-brand">Banco Gitano</span>
    <div class="topbar-right">
      <span class="topbar-user" id="user-greeting"></span>
      <button class="btn-logout" onclick="logout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Log out
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Summary -->
    <div class="summary-row">
      <div class="s-card income">
        <div class="label">Income</div>
        <div class="value" id="sum-income">—</div>
      </div>
      <div class="s-card expense">
        <div class="label">Expenses</div>
        <div class="value" id="sum-expense">—</div>
      </div>
      <div class="s-card balance">
        <div class="label">Balance</div>
        <div class="value" id="sum-balance">—</div>
      </div>
    </div>

    <!-- Refresh -->
    <button class="btn-refresh" id="btn-refresh" onclick="refresh()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-4.95"/>
      </svg>
      Sync with Tink
    </button>

    <div class="filter-row">
      <span>Month</span>
      <select id="month-filter" class="month-filter" onchange="applyMonthFilter()">
        <option value="all">All months</option>
      </select>
    </div>

    <!-- View area -->
    <div class="view-card">
      <h2 id="view-title">Earned vs Spent</h2>
      <div class="chart-wrap" id="chart-wrap">
        <canvas id="main-chart"></canvas>
      </div>
      <div id="table-wrap" style="display:none; overflow-x:auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-bar" onclick="switchView('bar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3"  y="12" width="4" height="9" rx="1"/>
        <rect x="10" y="6"  width="4" height="15" rx="1"/>
        <rect x="17" y="9"  width="4" height="12" rx="1"/>
        <line x1="2" y1="21" x2="22" y2="21"/>
      </svg>
      Columns
    </button>
    <button class="nav-btn" id="nav-pie" onclick="switchView('pie')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
        <path d="M22 12A10 10 0 0 0 12 2v10z"/>
      </svg>
      Pie
    </button>
    <button class="nav-btn" id="nav-table" onclick="switchView('table')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="3"  y1="9"  x2="21" y2="9"/>
        <line x1="3"  y1="15" x2="21" y2="15"/>
        <line x1="9"  y1="3"  x2="9"  y2="21"/>
        <line x1="15" y1="3"  x2="15" y2="21"/>
      </svg>
      Table
    </button>
    <button class="nav-btn" id="nav-line" onclick="switchView('line')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      Line
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="../scripts/script.js"></script>
  <script>
    // Auth guard
    const session = JSON.parse(localStorage.getItem('bg_session') || 'null');
    if (!session) window.location.replace('login.html');

    const firstName = (session?.name || session?.email || 'User').split(' ')[0];
    document.getElementById('user-greeting').textContent = firstName;

    // State
    let currentView  = 'bar';
    let chartInstance = null;
    let selectedMonth = 'all';

    const EARNED_COLOR = '#4caf50';
    const SPENT_COLOR  = '#ef5350';

    // ── Init — load data from Tink (or cache) ─────────────────────
    async function init() {
      setRefreshSpinning(true);

      let loaded = restoreCachedTransactions();   // instant — sessionStorage cache

      if (!loaded && getAccessToken()) {
        try {
          loaded = await loadTinkData();          // GET /api/tink/transactions
        } catch (err) {
          console.error('Tink API error:', err);
          showToast('Could not load transactions.');
        }
      }

      setRefreshSpinning(false);

      populateMonthFilter();

      if (!loaded || transactions.length === 0) {
        showEmptyState();
        return;
      }

      renderSummary();
      switchView('bar');
    }

    init();

    // ── Empty state ───────────────────────────────────────────────
    function showEmptyState() {
      document.getElementById('sum-income').textContent  = '—';
      document.getElementById('sum-expense').textContent = '—';
      document.getElementById('sum-balance').textContent = '—';
      document.getElementById('view-title').textContent  = 'No data';
      document.getElementById('chart-wrap').innerHTML =
        `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                     height:200px;gap:12px;color:#555;font-size:0.875rem;text-align:center;padding:0 24px;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#444"
               stroke-width="1.5" stroke-linecap="round">
            <rect x="2" y="7" width="20" height="14" rx="2"/>
            <path d="M16 7V5a2 2 0 0 0-4 0v2"/>
            <line x1="12" y1="12" x2="12" y2="16"/>
            <circle cx="12" cy="12" r=".5" fill="#444"/>
          </svg>
          <span>No bank data connected yet.<br>
            Tap <strong style="color:#aaa">Sync with Tink</strong> to link your bank account.</span>
        </div>`;
    }

    // ── Refresh / Sync with Tink ──────────────────────────────────
    async function refresh() {
      setRefreshSpinning(true);

      if (!getAccessToken()) {
        // No token yet — send the user through Tink Link to connect a bank.
        // The server creates the link session; we only receive the redirect URL.
        showToast('Opening Tink…');
        try {
          let { tinkUserId, email } = session;

          // Ensure the user exists in Tink before requesting a link session.
          // Sign-up already calls createTinkUser, but login does not, so we
          // call it here as well (the endpoint is idempotent — 409 = OK).
          if (!tinkUserId) {
            const result = await createTinkUser(email, session.country || 'ES');
            tinkUserId = result.tinkUserId;
            // Persist the Tink user ID so we don't repeat this next time
            if (tinkUserId) {
              session.tinkUserId = tinkUserId;
              localStorage.setItem('bg_session', JSON.stringify(session));
            }
          }

          const url = await buildTinkLinkUrl(tinkUserId || null, email);
          window.location.href = url;
        } catch (err) {
          console.error('Link-session error:', err);
          showToast('Could not open Tink. Try again.');
          setRefreshSpinning(false);
        }
        return;
      }

      // Already have a token — re-fetch fresh data
      showToast('Syncing with Tink…');
      try {
        // Clear cache so we fetch fresh data
        sessionStorage.removeItem('tink_transactions');
        await loadTinkData();
        populateMonthFilter();
        renderSummary();
        switchView(currentView);
        showToast('Up to date');
      } catch (err) {
        console.error('Tink sync error:', err);
        showToast('Sync failed — try reconnecting your bank');
      } finally {
        setRefreshSpinning(false);
      }
    }

    function setRefreshSpinning(on) {
      const btn = document.getElementById('btn-refresh');
      btn.classList.toggle('spinning', on);
      btn.disabled = on;
    }

    function formatMonthLabel(monthKey) {
      const [year, month] = monthKey.split('-');
      const date = new Date(Number(year), Number(month) - 1, 1);
      return date.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    }

    function populateMonthFilter() {
      const select = document.getElementById('month-filter');
      const prev = select.value || selectedMonth || 'all';
      const months = [...new Set(transactions.map(t => (t.date || '').slice(0, 7)).filter(Boolean))]
        .sort()
        .reverse();

      select.innerHTML = '<option value="all">All months</option>' +
        months.map(m => `<option value="${m}">${formatMonthLabel(m)}</option>`).join('');

      const nextValue = months.includes(prev) || prev === 'all' ? prev : 'all';
      select.value = nextValue;
      selectedMonth = nextValue;
      select.disabled = months.length === 0;
    }

    function getFilteredTransactions() {
      if (selectedMonth === 'all') return transactions;
      return transactions.filter(t => (t.date || '').startsWith(selectedMonth));
    }

    function applyMonthFilter() {
      selectedMonth = document.getElementById('month-filter').value;
      renderSummary();
      switchView(currentView);
    }

    // Summary
    function renderSummary() {
      const filtered = getFilteredTransactions();
      const inc = filtered.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
      const exp = filtered.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
      document.getElementById('sum-income').textContent  = `+€${inc.toFixed(0)}`;
      document.getElementById('sum-expense').textContent = `-€${exp.toFixed(0)}`;
      const bal = inc - exp;
      document.getElementById('sum-balance').textContent = `${bal >= 0 ? '+' : ''}€${bal.toFixed(0)}`;
    }

    // Logout
    function logout() {
      localStorage.removeItem('bg_session');
      sessionStorage.removeItem('tink_access_token');
      sessionStorage.removeItem('tink_transactions');
      window.location.replace('login.html');
    }

    // View switcher
    function switchView(view) {
      currentView = view;
      ['bar','pie','table','line'].forEach(v =>
        document.getElementById(`nav-${v}`).classList.toggle('active', v === view)
      );
      const chartWrap = document.getElementById('chart-wrap');
      const tableWrap = document.getElementById('table-wrap');
      const titleEl   = document.getElementById('view-title');

      if (view === 'table') {
        chartWrap.style.display = 'none';
        tableWrap.style.display = 'block';
        titleEl.textContent = 'Transactions';
        renderTable();
      } else {
        chartWrap.style.display = 'block';
        tableWrap.style.display = 'none';
        if (view === 'bar')  { titleEl.textContent = 'Earned vs Spent'; renderBarChart();  }
        if (view === 'pie')  { titleEl.textContent = 'Earned vs Spent'; renderPieChart();  }
        if (view === 'line') { titleEl.textContent = 'Earned vs Spent Over Time'; renderLineChart(); }
      }
    }

    function destroyChart() {
      if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    }

    // Bar
    function renderBarChart() {
      destroyChart();
      const filtered = getFilteredTransactions();
      const earned = filtered.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const spent = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      chartInstance = new Chart(document.getElementById('main-chart'), {
        type: 'bar',
        data: {
          labels: ['Earned', 'Spent'],
          datasets: [{ data: [earned, spent], backgroundColor: [EARNED_COLOR, SPENT_COLOR], borderRadius: 5, borderWidth: 0 }]
        },
        options: sharedOpts()
      });
    }

    // Pie
    function renderPieChart() {
      destroyChart();
      const filtered = getFilteredTransactions();
      const earned = filtered.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
      const spent = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
      chartInstance = new Chart(document.getElementById('main-chart'), {
        type: 'doughnut',
        data: {
          labels: ['Earned', 'Spent'],
          datasets: [{ data: [earned, spent], backgroundColor: [EARNED_COLOR, SPENT_COLOR], borderColor: '#161618', borderWidth: 2, hoverOffset: 6 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '58%',
          plugins: {
            legend: { position: 'bottom', labels: { color: '#555', font: { size: 11 }, padding: 12, usePointStyle: true } },
            tooltip: { callbacks: { label: ctx => ` €${ctx.parsed.toFixed(2)}` } }
          }
        }
      });
    }

    // Line
    function renderLineChart() {
      destroyChart();
      const sorted = [...getFilteredTransactions()].sort((a,b) => new Date(a.date) - new Date(b.date));
      const byDay = {};
      sorted.forEach(t => {
        const day = t.date.slice(5);
        if (!byDay[day]) byDay[day] = { earned: 0, spent: 0 };
        if (t.type === 'income') byDay[day].earned += t.amount;
        else byDay[day].spent += t.amount;
      });
      const labels = Object.keys(byDay);
      const earnedData = labels.map(d => +byDay[d].earned.toFixed(2));
      const spentData = labels.map(d => +byDay[d].spent.toFixed(2));
      chartInstance = new Chart(document.getElementById('main-chart'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Earned',
            data: earnedData,
            borderColor: EARNED_COLOR,
            backgroundColor: '#4caf5015',
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: EARNED_COLOR,
            fill: true,
            tension: 0.35
          }, {
            label: 'Spent',
            data: spentData,
            borderColor: SPENT_COLOR,
            backgroundColor: '#ef535015',
            borderWidth: 2,
            pointRadius: 3,
            pointBackgroundColor: SPENT_COLOR,
            fill: true,
            tension: 0.35
          }]
        },
        options: {
          ...sharedOpts(),
          plugins: {
            ...sharedOpts().plugins,
            legend: {
              display: true,
              labels: { color: '#888', font: { size: 11 } }
            }
          }
        }
      });
    }

    // Table
    function renderTable() {
      const sorted = [...getFilteredTransactions()].sort((a,b) => new Date(b.date) - new Date(a.date));
      document.getElementById('table-body').innerHTML = sorted.map(t => `
        <tr>
          <td>${t.date.slice(5)}</td>
          <td class="desc">${t.description}</td>
          <td class="${t.type === 'income' ? 'inc' : 'exp'}">
            ${t.type === 'income' ? '+' : '-'}€${t.amount.toFixed(2)}
          </td>
        </tr>`).join('');
    }

    // Shared chart options
    function sharedOpts() {
      return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1e1e22',
            titleColor: '#f0f0f0',
            bodyColor: '#888',
            borderColor: '#2a2a2e',
            borderWidth: 1,
            callbacks: { label: ctx => ` €${(ctx.parsed.y ?? ctx.parsed).toFixed(2)}` }
          }
        },
        scales: {
          x: { grid: { color: '#1e1e22' }, ticks: { color: '#444', font: { size: 10 } } },
          y: {
            grid: { color: '#1e1e22' },
            ticks: { color: '#444', font: { size: 10 }, callback: v => `€${v}` },
            beginAtZero: true
          }
        }
      };
    }

    // Toast
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }
  </script>

</body>
</html>
