<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco DAW</title>
  <style>
    body {
      margin: 0;
      background: #07070d;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1a237e55;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <script src="scripts/script.js"></script>
  <script>
    (async () => {
      // ── Tink redirect callback ────────────────────────────────────
      // After the user links their bank, Tink redirects here with ?code=XXX.
      // We exchange the code server-side (keeping client_secret safe) and
      // store only the resulting access token in sessionStorage.
      const params   = new URLSearchParams(window.location.search);
      const tinkCode = params.get('code');

      if (tinkCode) {
        try {
          await exchangeCodeForToken(tinkCode);   // POST /api/tink/token
        } catch (err) {
          console.error('Token exchange error:', err);
        }
        // Clean ?code= from URL regardless of success
        window.history.replaceState({}, '', window.location.pathname);
        window.location.replace('pages/home.html');
        return;
      }

      // ── Normal routing ────────────────────────────────────────────
      const session = localStorage.getItem('bg_session');
      if (session) {
        window.location.replace('pages/home.html');
      } else {
        window.location.replace('pages/login.html');
      }
    })();
  </script>
</body>
</html>
